name: Apply inline YouTube recommendation update

on:
  push:
    branches:
      - fix/knowledge-inline-video-20260828

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/knowledge-inline-video-20260828
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded source update
        run: python .github/scripts/apply_inline_video_update.py

      - name: Install dependencies
        run: npm ci

      - name: Verify lint build tests security and preflight
        run: npm run verify

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit verified source update
        run: |
          rm -f .github/scripts/apply_inline_video_update.py .github/workflows/apply-inline-video-update.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "dmfc-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "[dmfc-ready] Keep YouTube inside care recommendations"
          git push origin HEAD:fix/knowledge-inline-video-20260828
