name: Verify hardened user lifecycle UI
on:
  push:
    branches:
      - feat/admin-user-trash
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Harden lifecycle form
        run: node scripts/harden-user-lifecycle-ui.mjs
      - name: Verify application
        run: npm run verify
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/legacy65925.css
          git commit -m "Require lifecycle actions for user status changes" || exit 0
          git push
