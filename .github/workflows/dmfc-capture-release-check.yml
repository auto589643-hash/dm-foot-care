name: DMFC Capture Release QA (temporary)
on:
  push:
    branches: [release/dmfc-manual-capture-20261025]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364ad8
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Manual capture contract checks
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import assert from 'node:assert/strict'
          const source = fs.readFileSync('src/App.tsx','utf8')
          const capture = source.split('function CaptureStep(')[1].split('function PhotoReview(')[0]
          assert.ok(capture.includes('กดถ่ายภาพด้วยตนเอง'))
          assert.ok(capture.includes('อัปโหลดรูป'))
          assert.ok(capture.includes('live-quality-panel'))
          assert.ok(capture.includes('readAsDataURL'))
          assert.ok(capture.includes('ใช้ภาพนี้และไปภาพถัดไป'))
          assert.ok(!capture.includes('scanProgress'))
          assert.ok(!capture.includes('scanState'))
          assert.ok(!capture.includes('setTimeout(() => onNext()'))
          assert.equal((capture.match(/void capturePhoto\(\)/g)||[]).length,1)
          console.log('Manual-only capture contract checks passed')
          NODE
