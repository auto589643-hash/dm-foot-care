name: Apply DMFC feature update

on:
  push:
    branches:
      - feat/dmfc-accessibility-registration-20260828

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[dmfc-ready]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/dmfc-accessibility-registration-20260828
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply guarded source update
        run: python3 scripts/apply_dmfc_feature_update.py

      - name: Install dependencies
        run: npm ci

      - name: Verify lint build tests security and preflight
        run: npm run verify

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit verified source update
        run: |
          rm -f scripts/apply_dmfc_feature_update.py .github/workflows/apply-dmfc-feature-update.yml
          git add -A
          git config user.name "dmfc-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "[dmfc-ready] Implement accessible registration and care guidance"
          git push origin HEAD:feat/dmfc-accessibility-registration-20260828
