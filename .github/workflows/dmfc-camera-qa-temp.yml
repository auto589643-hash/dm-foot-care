name: DMFC Mobile Camera QA temporary
on:
  push:
    branches: [release/dmfc-capture-clean-minimal-20261025]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:ai
      - run: node --experimental-strip-types tests/photo_import.test.ts
      - run: node --experimental-strip-types tests/security_surface.test.ts
      - run: node tests/session_cookie.test.mjs
      - run: npm run test:preflight
      - name: Scoped camera and layout regression contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import assert from 'node:assert/strict'
          const app = fs.readFileSync('src/App.tsx','utf8')
          const css = fs.readFileSync('src/capture-minimal.css','utf8')
          const img = fs.readFileSync('src/services/photoImport.ts','utf8')
          const camera = app.split('function CaptureStep(')[1].split('function PhotoReview(')[0]
          assert.match(camera,/ref=\{attachVideo\}/)
          assert.match(camera,/normalizeSelectedPhoto\(file\)/)
          assert.match(camera,/live-quality-panel/)
          assert.match(camera,/aria-label="กดถ่ายภาพด้วยตนเอง"/)
          assert.match(camera,/ใช้ภาพนี้และไปภาพถัดไป/)
          assert.doesNotMatch(camera,/setTimeout\(\(\) => onNext\(\)/)
          assert.equal((camera.match(/void capturePhoto\(\)/g)||[]).length,1)
          assert.match(css,/position: fixed !important/)
          assert.match(css,/height: 100dvh/)
          assert.match(css,/overflow: hidden/)
          assert.match(css,/\.manual-camera-actions/)
          assert.match(img,/toDataURL\('image\/jpeg'/)
          console.log('Scoped capture UI, upload and no-auto-advance regression checks passed')
          NODE
