name: DMFC Admin History and Capture UX Hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dmfc-admin-history-ux-hotfix.yml

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record baseline revision-contract state
        shell: bash
        run: |
          set +e
          node --experimental-strip-types tests/result_revision_notification_contract.test.ts > /tmp/baseline-revision.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            grep -q "stale revisions become deterministic conflict response" /tmp/baseline-revision.log || { cat /tmp/baseline-revision.log; exit "$status"; }
          fi
          echo "BASELINE_REVISION_CONTRACT_STATUS=$status" >> "$GITHUB_ENV"

      - name: Apply UX patch
        run: python .github/scripts/dmfc-admin-history-ux-hotfix.py

      - name: Verify patch
        shell: bash
        run: |
          npm run lint -- --fix
          npm run lint
          npm run build
          npm run test:ai
          node --experimental-strip-types tests/security_surface.test.ts
          node tests/session_cookie.test.mjs
          npm run test:preflight
          set +e
          node --experimental-strip-types tests/result_revision_notification_contract.test.ts > /tmp/post-revision.log 2>&1
          post_status=$?
          set -e
          if [ "$post_status" -ne "$BASELINE_REVISION_CONTRACT_STATUS" ]; then
            echo "Result-revision contract changed from baseline: $BASELINE_REVISION_CONTRACT_STATUS -> $post_status"
            cat /tmp/post-revision.log
            exit 1
          fi
          if [ "$post_status" -ne 0 ]; then
            grep -q "stale revisions become deterministic conflict response" /tmp/post-revision.log || { cat /tmp/post-revision.log; exit "$post_status"; }
            echo "Known pre-existing revision-contract failure is unchanged by this patch."
          fi

      - name: Commit verified patch and remove one-shot files
        shell: bash
        run: |
          rm .github/workflows/dmfc-admin-history-ux-hotfix.yml
          rm .github/scripts/dmfc-admin-history-ux-hotfix.py
          git config user.name "Emily DMFC Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/types.ts src/accessibility-overrides.css backend/api/v1/admin/dashboard.mjs backend/api/v1/admin/bootstrap.mjs tests/feature_update_contract.test.ts .github/workflows/dmfc-admin-history-ux-hotfix.yml .github/scripts/dmfc-admin-history-ux-hotfix.py
          git diff --cached --check
          git commit -m "fix(dmfc): fit admin viewport and improve exam history flow"
          git push origin HEAD:main
