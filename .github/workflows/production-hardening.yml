name: Production hardening

on:
  push:
    branches:
      - fix/remove-mocks-production-hardening

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-mocks-production-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/finalize_no_mock_runtime.mjs
      - run: node scripts/fix_final_runtime_lint.mjs
      - name: Remove obsolete temporary codemods from validation workspace
        run: rm -f scripts/apply_production_hardening.mjs scripts/normalize_hardening_script.mjs scripts/fix_hardening_lint.mjs
      - run: npm run lint
      - run: npm run build
      - run: npm run test:ai
      - run: npm run test:security
      - name: Commit final runtime cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src backend README.md
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Remove final runtime mock remnants"
            git push origin HEAD:fix/remove-mocks-production-hardening
          fi
