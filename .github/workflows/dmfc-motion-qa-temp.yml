name: DMFC Capture Motion QA (temporary)
on:
  push:
    branches: [release/dmfc-camera-microinteractions-20261027]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:ai
      - run: node --experimental-strip-types tests/security_surface.test.ts
      - run: node tests/session_cookie.test.mjs
      - run: npm run test:preflight
      - name: Camera motion, accessibility and no-auto-capture regression
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import assert from 'node:assert/strict'
          const app = fs.readFileSync('src/App.tsx', 'utf8')
          const css = fs.readFileSync('src/capture-minimal.css', 'utf8')
          const capture = app.split('function CaptureStep(')[1].split('function PhotoReview(')[0]
          for (const name of ['แสง', 'ความชัด', 'ความนิ่ง']) {
            assert.ok(capture.includes("label: '"+name+"'"), 'missing live status '+name)
          }
          assert.match(capture, /single-foot/)
          assert.match(capture, /aria-label="กดถ่ายภาพด้วยตนเอง"/)
          assert.match(capture, /อัปโหลดรูป/)
          assert.match(capture, /ใช้ภาพนี้และไปภาพถัดไป/)
          assert.equal((capture.match(/void capturePhoto\(\)/g)||[]).length, 1)
          assert.doesNotMatch(capture, /scanProgress|readyLatchedRef/)
          assert.match(css, /prefers-reduced-motion: reduce/)
          assert.match(css, /\.foot-guide \.single-foot/)
          assert.match(css, /\.live-quality-item/)
          assert.match(css, /\.camera-viewport\.has-photo/)
          assert.match(css, /\.quality-result/)
          assert.match(css, /:focus-visible/)
          assert.match(css, /:active:not\(:disabled\)/)
          for (const motion of ['dmfc-guide-settle', 'dmfc-quality-panel-arrive', 'dmfc-still-arrive', 'dmfc-review-arrive']) {
            assert.ok(css.includes('@keyframes '+motion), 'missing keyed state '+motion)
          }
          assert.doesNotMatch(css, /animation-iteration-count:\s*infinite/)
          console.log('DMFC motion and clinical usability contracts passed')
          NODE
