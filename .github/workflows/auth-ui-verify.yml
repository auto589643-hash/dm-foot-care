name: Verify auth feedback and preferred UI

on:
  push:
    branches:
      - agent/restore-65925-auth-feedback

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-65925-auth-feedback
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply auth field feedback
        run: node scripts/apply-auth-feedback.mjs
      - name: Verify application
        run: npm run verify
      - name: Commit generated App change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Add detailed login and registration feedback"
            git push origin HEAD:agent/restore-65925-auth-feedback
          fi
