name: DMFC v3.1 validation

on:
  push:
    branches:
      - verify/dmfc-v31-staff-review-20260913

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply scoped implementation
        run: |
          cat .github/dmfc-v31-patch.* | base64 -d | gzip -d > /tmp/implement_dmfc_v31.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/implement_dmfc_v31.mjs')
          text = path.read_text()
          text = text.replace('\\\\/', '\\/')
          text = text.replace(
              "  const source = read(path)\n  if (!source.includes(from)) throw new Error(`Patch marker not found in ${path}: ${from.slice(0,120)}`)\n",
              "  let source = read(path)\n  if (!source.includes(from) && from.endsWith('\\n') && source.includes(from.slice(0, -1))) from = from.slice(0, -1)\n  if (!source.includes(from)) throw new Error(`Patch marker not found in ${path}: ${from.slice(0,120)}`)\n",
          )
          path.write_text(text)
          PY
          node --check /tmp/implement_dmfc_v31.mjs
          node /tmp/implement_dmfc_v31.mjs
          node - <<'NODE'
          const fs = require('node:fs')
          const path = 'src/App.tsx'
          let text = fs.readFileSync(path, 'utf8')
          function replaceOnce(from, to, label) {
            const index = text.indexOf(from)
            if (index < 0) throw new Error(`${label} marker missing`)
            if (text.indexOf(from, index + from.length) >= 0) throw new Error(`${label} marker not unique`)
            text = text.slice(0, index) + to + text.slice(index + from.length)
          }

          replaceOnce(
          `function HistoryPage({ examinations: patientExaminations, diseaseRecords, openExaminationId, onExaminationOpened }: { examinations: Examination[]; diseaseRecords: Disease[]; openExaminationId?: string | null; onExaminationOpened?: () => void }) {
            const [view, setView] = useState<HistoryView>('list')
            const [selected, setSelected] = useState<Examination | null>(null)
            useEffect(() => {
              if (!openExaminationId) return
              const target = patientExaminations.find((exam) => exam.id === openExaminationId)
              if (!target) return
              setSelected(target)
              setView('list')
              onExaminationOpened?.()
            }, [openExaminationId, onExaminationOpened, patientExaminations])
            return (
          `,
          `function HistoryPage({ examinations: patientExaminations, diseaseRecords, openExaminationId, onExaminationOpened }: { examinations: Examination[]; diseaseRecords: Disease[]; openExaminationId?: string | null; onExaminationOpened?: () => void }) {
            const [view, setView] = useState<HistoryView>('list')
            const [selected, setSelected] = useState<Examination | null>(null)
            const targetedExamination = openExaminationId ? patientExaminations.find((exam) => exam.id === openExaminationId) ?? null : null
            const activeSelected = targetedExamination ?? selected
            const closeSelected = () => {
              setSelected(null)
              if (targetedExamination) onExaminationOpened?.()
            }
            return (
          `,
            'history deep link',
          )

          replaceOnce(
            `      {selected ? <ExaminationDetail exam={selected} diseaseRecords={diseaseRecords} onClose={() => setSelected(null)} /> : null}`,
            `      {activeSelected ? <ExaminationDetail exam={activeSelected} diseaseRecords={diseaseRecords} onClose={closeSelected} /> : null}`,
            'history selected detail',
          )

          replaceOnce(
          `  const [requestId, setRequestId] = useState(() => crypto.randomUUID())
            const [addDiseaseId, setAddDiseaseId] = useState('')

            const load = useCallback(async () => {
              setLoading(true); setError('')
              try {
          `,
          `  const [requestId, setRequestId] = useState('')
            const [addDiseaseId, setAddDiseaseId] = useState('')

            const load = useCallback(async () => {
              try {
          `,
            'staff review load',
          )

          replaceOnce(
          `  useEffect(() => { void load() }, [load])

            const original = detail?.currentFindings ?? []`,
          `  useEffect(() => { void load() }, [load])

            const retryLoad = () => {
              setLoading(true)
              setError('')
              void load()
            }

            const original = detail?.currentFindings ?? []`,
            'staff retry',
          )

          replaceOnce('onClick={() => void load()}>โหลดล่าสุด</button>', 'onClick={retryLoad}>โหลดล่าสุด</button>', 'staff conflict retry')
          replaceOnce('onClick={() => void load()}>ลองใหม่</button>', 'onClick={retryLoad}>ลองใหม่</button>', 'staff load retry')

          replaceOnce(
          `  useEffect(() => { void load() }, [load])

            const retryLoad = () => {`,
          `  useEffect(() => {
              let cancelled = false
              void Promise.all([
                adminService.getExaminationReview(exam.id),
                adminService.getExaminationThumbnails(exam.id).catch(() => ({})),
              ]).then(([review, images]) => {
                if (cancelled) return
                setDetail(review)
                setDraft(review.currentFindings.map((finding) => ({ ...finding })))
                setThumbnails(images)
                setRequestId(crypto.randomUUID())
              }).catch((loadError) => {
                if (!cancelled) setError(loadError instanceof Error && loadError.message ? loadError.message : 'โหลดข้อมูลตรวจทานไม่สำเร็จ')
              }).finally(() => {
                if (!cancelled) setLoading(false)
              })
              return () => { cancelled = true }
            }, [adminService, exam.id])

            const retryLoad = () => {`,
            'staff initial load effect',
          )

          replaceOnce('alt={step.title}', 'alt={step.label}', 'staff review photo alt')
          fs.writeFileSync(path, text)

          const testPath = 'tests/result_revision_notification_contract.test.ts'
          let testText = fs.readFileSync(testPath, 'utf8')
          const badRouteLine = testText.split('\n').find((line) => line.includes("'staff review route is wired'"))
          if (!badRouteLine) throw new Error('staff review route contract marker missing')
          testText = testText.replace(badRouteLine, "assert.match(router, /adminExaminationReview/, 'staff review route is wired')")
          fs.writeFileSync(testPath, testText)
          NODE
          rm .github/dmfc-v31-patch.* .github/workflows/dmfc-v31-verify.yml
      - name: Install dependencies
        run: npm ci
      - name: Whitespace verification
        run: git diff --check
      - name: Full repository verification
        run: npm run verify
      - name: Commit tested implementation
        run: |
          git status --short
          git config user.name "dmfc-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(dmfc): add staff result revisions and durable notifications"
          git push origin HEAD:verify/dmfc-v31-staff-review-20260913
