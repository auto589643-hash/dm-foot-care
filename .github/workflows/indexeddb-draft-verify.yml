name: IndexedDB Draft Verify

permissions:
  contents: write

on:
  push:
    branches:
      - agent/indexeddb-drafts
    paths:
      - .github/workflows/indexeddb-draft-verify.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply App codemod
        run: node scripts/indexeddb-draft-codemod.mjs
      - name: Verify IndexedDB draft migration
        run: npm run verify
      - name: Commit clean IndexedDB implementation
        run: |
          rm scripts/indexeddb-draft-codemod.mjs
          rm .github/workflows/indexeddb-draft-verify.yml
          git config user.name "dmfc-performance-bot"
          git config user.email "auto589643@gmail.com"
          git add -A
          git commit -m "Store examination drafts in IndexedDB"
          git push origin HEAD:agent/indexeddb-drafts
