name: Project Owner Regression Pass

on:
  push:
    branches:
      - fix/project-owner-regression-pass

permissions:
  contents: write

jobs:
  regression-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-owner-regression-pass
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply linked regression fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          # 1) Legacy Supabase Auth compatibility: visible username must not be assumed
          # to equal the internal Supabase email local-part.
          path = Path('backend/api/_lib/supabase.mjs')
          text = path.read_text()
          old = """  const email = internalAuthEmail(normalizedUsername)
          const internalPassword = internalAuthPassword(normalizedUsername)
          let tokenResponse = await requestPasswordToken(url, publishableKey, email, internalPassword)

          // Existing accounts created before deterministic internal credentials may
          // still have a random Supabase password. Repair once, then future logins use
          // the direct token path without an admin user read/write round trip.
          if (!tokenResponse.ok) {
            const passwordUpdate = await fetch(`${url}/auth/v1/admin/users/${encodeURIComponent(profile.user_id)}`, {
              method: 'PUT',
              headers: { ...headers, 'content-type': 'application/json' },
              body: JSON.stringify({ password: internalPassword, email_confirm: true }),
            })
            if (!passwordUpdate.ok) return null
            tokenResponse = await requestPasswordToken(url, publishableKey, email, internalPassword)
          }

          if (!tokenResponse.ok) return null
          const token = await tokenResponse.json()
"""
          new = """  const preferredEmail = internalAuthEmail(normalizedUsername)
          const internalPassword = internalAuthPassword(normalizedUsername)
          let signInEmail = preferredEmail
          let tokenResponse = await requestPasswordToken(url, publishableKey, signInEmail, internalPassword)

          // Backward compatibility is intentionally isolated to the slow path. A profile's
          // visible username is a product identifier and is not guaranteed to match the
          // internal Supabase Auth email used by accounts created before deterministic
          // credentials. Read the Auth user by immutable user_id, repair its password once,
          // then authenticate with the email that actually belongs to that Auth identity.
          if (!tokenResponse.ok) {
            const authUserResponse = await fetch(`${url}/auth/v1/admin/users/${encodeURIComponent(profile.user_id)}`, {
              headers,
            })
            if (!authUserResponse.ok) return null
            const authUser = await authUserResponse.json()
            signInEmail = String(authUser?.email || '').trim().toLowerCase()
            if (!signInEmail) return null

            const passwordUpdate = await fetch(`${url}/auth/v1/admin/users/${encodeURIComponent(profile.user_id)}`, {
              method: 'PUT',
              headers: { ...headers, 'content-type': 'application/json' },
              body: JSON.stringify({ password: internalPassword, email_confirm: true }),
            })
            if (!passwordUpdate.ok) return null
            tokenResponse = await requestPasswordToken(url, publishableKey, signInEmail, internalPassword)
          }

          if (!tokenResponse.ok) return null
          const token = await tokenResponse.json()
          if (!token?.user?.id || token.user.id !== profile.user_id) return null
"""
          assert old in text, 'supabase auth block changed; refusing unsafe blind patch'
          path.write_text(text.replace(old, new))

          # 2) Finalization failures must retain their actual phase. A persistence failure
          # must never be mislabeled as thumbnail_failed.
          path = Path('src/services/finalizeWorkflow.ts')
          text = path.read_text()
          start = text.index('/** Generate web-only thumbnails after the final clinical result is confirmed. */')
          prefix = text[:start]
          replacement = r'''/** Generate web-only thumbnails after the final clinical result is confirmed. */
          export async function finalizeExamination(input: FinalizeExaminationInput): Promise<Record<FootPosition, string>> {
            const { examinationId, images, thumbnailService, repository, confirmedFindings = [], confirmedBy, auditLogger, actorId, reviewChangedCount = 0, precomputedThumbnails } = input

            const markThumbnailFailed = async () => {
              try {
                await repository.updateStatus(examinationId, 'thumbnail_failed')
              } catch {
                // Preserve the original thumbnail failure if the secondary status write fails.
              }
            }

            // Production HTTP path: thumbnails may already exist before human review. Keep
            // thumbnail persistence and clinical finalization as separate failure domains so
            // a retryable database/API error does not corrupt the examination state.
            if (confirmedBy && repository.finalizeExamination) {
              let thumbnails: Record<FootPosition, string>
              try {
                thumbnails = precomputedThumbnails ?? await thumbnailService.generateAndStore(examinationId, images)
                await repository.saveThumbnailReferences({ examinationId, thumbnails })
              } catch (cause) {
                await markThumbnailFailed()
                throw new FinalizePipelineError('สร้างภาพสรุปไม่สำเร็จ กรุณาลองอีกครั้งโดยไม่ต้องถ่ายภาพใหม่', examinationId, cause)
              }

              try {
                await repository.finalizeExamination({
                  examinationId,
                  confirmedBy,
                  reviewChangedCount,
                  findings: confirmedFindings.map((finding) => ({ diseaseId: finding.diseaseId, severity: finding.severity })),
                })
              } catch (cause) {
                throw new FinalizePipelineError('บันทึกผลตรวจไม่สำเร็จ กรุณาลองส่งผลอีกครั้งโดยไม่ต้องถ่ายภาพใหม่', examinationId, cause)
              }
              return thumbnails
            }

            // Granular adapter path used by tests/local integrations. Keep state-machine and
            // data persistence failures distinct from actual thumbnail failures here as well.
            try {
              await repository.updateStatus(examinationId, 'thumbnailing')
              if (confirmedBy && confirmedFindings.length) {
                if (repository.saveConfirmedFindings) {
                  await repository.saveConfirmedFindings({
                    examinationId,
                    confirmedBy,
                    findings: confirmedFindings.map((finding) => ({ diseaseId: finding.diseaseId, severity: finding.severity })),
                  })
                } else {
                  await Promise.all(confirmedFindings.map((finding) => repository.saveConfirmedFinding({
                    examinationId,
                    diseaseId: finding.diseaseId,
                    severity: finding.severity,
                    confirmedBy,
                  })))
                }
              }
            } catch (cause) {
              throw new FinalizePipelineError('เตรียมการบันทึกผลตรวจไม่สำเร็จ กรุณาลองอีกครั้ง', examinationId, cause)
            }

            let thumbnails: Record<FootPosition, string>
            try {
              thumbnails = precomputedThumbnails ?? await thumbnailService.generateAndStore(examinationId, images)
              await repository.saveThumbnailReferences({ examinationId, thumbnails })
            } catch (cause) {
              await markThumbnailFailed()
              throw new FinalizePipelineError('สร้างภาพสรุปไม่สำเร็จ กรุณาลองอีกครั้งโดยไม่ต้องถ่ายภาพใหม่', examinationId, cause)
            }

            try {
              if (auditLogger && reviewChangedCount > 0) {
                await auditLogger.append({ actorId: actorId ?? null, eventType: 'human_review_edited', entityType: 'finding', entityId: examinationId, payload: { changedCount: reviewChangedCount } })
              }
              await auditLogger?.append({ actorId: actorId ?? null, eventType: 'final_result_submitted', entityType: 'examination', entityId: examinationId, payload: { confirmedFindingCount: confirmedFindings.length } })
              await repository.updateStatus(examinationId, 'confirmed')
            } catch (cause) {
              throw new FinalizePipelineError('บันทึกผลตรวจไม่สำเร็จ กรุณาลองส่งผลอีกครั้งโดยไม่ต้องถ่ายภาพใหม่', examinationId, cause)
            }
            return thumbnails
          }
          '''
          path.write_text(prefix + replacement)

          # 3) Surface the real retry-safe finalization message instead of hiding every cause
          # behind a generic thumbnail message.
          path = Path('src/App.tsx')
          text = path.read_text()
          old = """    } catch {
                setFinalizeError('บันทึกผลและเตรียมภาพสรุปไม่สำเร็จ กรุณาลองอีกครั้งโดยไม่ต้องถ่ายภาพใหม่')
              } finally {
"""
          new = """    } catch (caught) {
                setFinalizeError(caught instanceof Error && caught.message ? caught.message : 'บันทึกผลตรวจไม่สำเร็จ กรุณาลองอีกครั้งโดยไม่ต้องถ่ายภาพใหม่')
              } finally {
"""
          assert old in text, 'finalize UI catch changed; refusing unsafe blind patch'
          path.write_text(text.replace(old, new, 1))

          # 4) Safari/mobile dashboard containment. The previous fix only sized the page
          # wrapper; one intrinsic-width child could still widen the layout and make iOS
          # shrink the whole visual page. Harden shell + every dashboard layout boundary.
          path = Path('src/legacy65925.css')
          text = path.read_text()
          marker = '/* Project-owner regression contract: mobile dashboard intrinsic-width containment. */'
          assert marker not in text
          text += r'''

          /* Project-owner regression contract: mobile dashboard intrinsic-width containment. */
          .app-shell { width: 100%; min-width: 0; max-width: 100%; overflow-x: clip; }
          @media (max-width: 900px) {
            .app-column,
            .top-bar,
            .main-content,
            .mobile-nav {
              width: 100%;
              min-width: 0;
              max-width: 100%;
            }

            .admin-dashboard-page,
            .admin-dashboard-page .admin-stat-grid,
            .admin-dashboard-page .admin-grid,
            .admin-dashboard-page .admin-panel,
            .admin-dashboard-page .followup-list,
            .admin-dashboard-page .activity-chart,
            .admin-dashboard-page .chart-legend,
            .admin-dashboard-page .section-heading {
              min-width: 0;
              max-width: 100%;
            }

            .admin-dashboard-page .admin-stat-grid,
            .admin-dashboard-page .admin-grid,
            .admin-dashboard-page .admin-panel,
            .admin-dashboard-page .followup-list,
            .admin-dashboard-page .activity-chart {
              width: 100%;
            }

            .admin-dashboard-page .section-heading,
            .admin-dashboard-page .chart-legend {
              flex-wrap: wrap;
            }
            .admin-dashboard-page .section-heading > *,
            .admin-dashboard-page .chart-legend > *,
            .admin-dashboard-page .followup-list button,
            .admin-dashboard-page .followup-list button > div {
              min-width: 0;
            }
            .admin-dashboard-page .followup-list .status-pill {
              flex: 0 1 auto;
              max-width: 44%;
              white-space: normal;
              overflow-wrap: anywhere;
              text-align: center;
            }
          }
          '''
          path.write_text(text)

          # 5) Record the already-applied production state-machine migration in source control.
          migration = Path('supabase/migrations/20260811100000_allow_optimized_examination_finalize.sql')
          migration.write_text(r'''-- The optimized pipeline creates thumbnails before human review, so a confirmed
          -- review can finalize directly from awaiting_review. Thumbnail failures remain
          -- retryable and distinct from persistence/finalize failures.
          create or replace function private.validate_examination_status_transition()
          returns trigger
          language plpgsql
          set search_path to 'pg_catalog'
          as $$
          begin
            if new.status = old.status then
              return new;
            end if;

            if (old.status = 'draft' and new.status in ('uploading', 'analysis_failed'))
              or (old.status = 'uploading' and new.status in ('analyzing', 'analysis_failed'))
              or (old.status = 'analyzing' and new.status in ('awaiting_review', 'analysis_failed'))
              or (old.status = 'awaiting_review' and new.status in ('thumbnailing', 'confirmed', 'thumbnail_failed', 'analysis_failed'))
              or (old.status = 'thumbnailing' and new.status in ('confirmed', 'thumbnail_failed'))
              or (old.status = 'analysis_failed' and new.status = 'uploading')
              or (old.status = 'thumbnail_failed' and new.status = 'thumbnailing') then
              return new;
            end if;

            raise exception 'invalid examination status transition: % -> %', old.status, new.status using errcode = '22023';
          end;
          $$;
          ''')

          # 6) Regression tests for the two bugs that escaped the earlier optimization pass.
          Path('tests/auth_legacy_compat.test.ts').write_text(r'''import assert from 'node:assert/strict'
          import { signInWithUsername } from '../backend/api/_lib/supabase.mjs'

          process.env.SUPABASE_URL = 'https://supabase.test'
          process.env.SUPABASE_SECRET_KEY = 'service-secret'
          process.env.SUPABASE_PUBLISHABLE_KEY = 'publishable-key'

          const userId = '00000000-0000-4000-8000-000000000001'
          const calls: Array<{ url: string; method: string; body?: unknown }> = []
          const json = (value: unknown, status = 200) => new Response(JSON.stringify(value), { status, headers: { 'content-type': 'application/json' } })
          const originalFetch = globalThis.fetch

          globalThis.fetch = async (input, init = {}) => {
            const url = String(input)
            const method = String(init.method || 'GET').toUpperCase()
            let body: unknown
            if (typeof init.body === 'string') {
              try { body = JSON.parse(init.body) } catch { body = init.body }
            }
            calls.push({ url, method, body })

            if (url.includes('/rest/v1/profiles?')) return json([{ user_id: userId, username: 'ADMIN_DMFC', display_name: 'ADMIN', date_of_birth: '1990-01-01', occupation: 'Admin', account_status: 'active' }])
            if (url.endsWith('/rest/v1/rpc/verify_dmfc_pin')) return json(true)
            if (url.includes('/auth/v1/token?grant_type=password')) {
              const email = (body as { email?: string })?.email
              if (email === 'admin_dmfc@dmfc.local') return json({ error: 'invalid credentials' }, 400)
              if (email === 'admin@dmfc.local') return json({ access_token: 'access', refresh_token: 'refresh', expires_in: 3600, user: { id: userId, email } })
            }
            if (url.endsWith(`/auth/v1/admin/users/${userId}`) && method === 'GET') return json({ id: userId, email: 'admin@dmfc.local' })
            if (url.endsWith(`/auth/v1/admin/users/${userId}`) && method === 'PUT') return json({ id: userId, email: 'admin@dmfc.local' })
            if (url.includes('/rest/v1/user_roles?')) return json([{ role: 'admin' }])
            throw new Error(`Unexpected request: ${method} ${url}`)
          }

          try {
            const session = await signInWithUsername('ADMIN_DMFC', '1234')
            assert.ok(session)
            assert.equal(session.profile.username, 'ADMIN_DMFC')
            assert.equal(session.profile.role, 'admin')
            assert.ok(calls.some((call) => call.method === 'GET' && call.url.endsWith(`/auth/v1/admin/users/${userId}`)))
            assert.ok(calls.some((call) => call.url.includes('/auth/v1/token') && (call.body as { email?: string })?.email === 'admin@dmfc.local'))
          } finally {
            globalThis.fetch = originalFetch
          }

          console.log('Legacy auth compatibility tests passed')
          ''')

          # Extend finalize tests: persistence failures must not write thumbnail_failed.
          path = Path('tests/finalize_workflow.test.ts')
          text = path.read_text()
          insert = r'''

          const persistenceFailureStatuses: string[] = []
          await assert.rejects(() => finalizeExamination({
            examinationId: 'EX-PERSISTENCE-FAIL',
            images,
            thumbnailService,
            confirmedBy: 'doctor-1',
            confirmedFindings: [{ diseaseId: 'D001', name: 'ผิวแห้ง', detected: true, severity: 'ปานกลาง', confidence: 90, comparison: 'คงที่' }],
            precomputedThumbnails: precomputed,
            repository: {
              ...repository,
              async updateStatus(_id, status) { persistenceFailureStatuses.push(status) },
              async finalizeExamination() { throw new Error('database unavailable') },
            },
          }), /บันทึกผลตรวจไม่สำเร็จ/)
          assert.deepEqual(persistenceFailureStatuses, [], 'persistence failure must not be mislabeled as thumbnail_failed')
          '''
          assert "console.log('Finalize workflow tests passed')" in text
          text = text.replace("\nconsole.log('Finalize workflow tests passed')", insert + "\n\nconsole.log('Finalize workflow tests passed')")
          path.write_text(text)

          # Static responsive contract: prevents deleting the containment fix without a test change.
          Path('tests/responsive_contract.test.ts').write_text(r'''import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'

          const css = readFileSync(new URL('../src/legacy65925.css', import.meta.url), 'utf8')
          for (const required of [
            'Project-owner regression contract: mobile dashboard intrinsic-width containment.',
            '.admin-dashboard-page .admin-grid',
            '.admin-dashboard-page .activity-chart',
            '.admin-dashboard-page .followup-list .status-pill',
            'overflow-wrap: anywhere',
          ]) assert.ok(css.includes(required), `Missing responsive regression contract: ${required}`)
          console.log('Responsive contract tests passed')
          ''')

          # Wire the new regression tests into the standard verify command.
          path = Path('package.json')
          text = path.read_text()
          needle = '"test:ai": "node --experimental-strip-types tests/ai_validator.test.ts'
          assert needle in text
          text = text.replace(needle, '"test:ai": "node --experimental-strip-types tests/auth_legacy_compat.test.ts && node --experimental-strip-types tests/responsive_contract.test.ts && node --experimental-strip-types tests/ai_validator.test.ts', 1)
          path.write_text(text)

          # 7) Project-owner checklist lives with the code so future changes must reason
          # through linked data, identity, state, storage, UI and release effects first.
          guardrail = Path('REGRESSION_CONTRACT.md')
          guardrail.write_text(r'''# DM Foot Care Regression Contract

          Before changing production behavior, evaluate the full dependency chain rather than the local symptom.

          ## Invariants
          - Visible username is a product identifier. Never assume it equals the internal Supabase Auth email.
          - Original examination images remain in Google Drive only.
          - Supabase stores clinical/data records and private thumbnails, not original examination images.
          - AI-sized images are transient analysis inputs.
          - A persistence/finalization failure is not a thumbnail failure; retain a retryable examination state.
          - The optimized lifecycle may finalize `awaiting_review -> confirmed` because thumbnails are produced before human review.
          - Patient and Admin historical image viewing use thumbnails first; original Drive images are fetched only on explicit full-image open.
          - Mobile layouts must tolerate long Thai text, browser text scaling and intrinsic-width content without widening the app shell.
          - A Git commit is not considered released until the Production deployment SHA matches it and health/runtime checks pass.

          ## Mandatory impact check before a production change
          1. Identity/Auth: username, Auth user id/email, role, account status, session restore and legacy accounts.
          2. State machine: current state, allowed next state, retry state, idempotency and failure classification.
          3. Storage: exact destination for original, thumbnail, metadata and temporary image data.
          4. API: caller count, authentication checks, duplicate work, retry behavior and partial-success behavior.
          5. UI: phone, Safari, zoom/text scaling, long Thai strings, loading/empty/error states and touch targets.
          6. Data compatibility: existing production rows, old examinations and accounts created under earlier versions.
          7. Release: CI verify, migration/source parity, Production SHA, health, runtime errors and rollback point.
          ''')
          PY
      - name: Verify complete application
        run: npm run verify
      - name: Commit validated regression pass
        run: |
          git config user.name "dmfc-regression-bot"
          git config user.email "auto589643@gmail.com"
          git add backend/api/_lib/supabase.mjs src/services/finalizeWorkflow.ts src/App.tsx src/legacy65925.css package.json tests/auth_legacy_compat.test.ts tests/finalize_workflow.test.ts tests/responsive_contract.test.ts supabase/migrations/20260811100000_allow_optimized_examination_finalize.sql REGRESSION_CONTRACT.md
          git commit -m "Harden linked auth finalize and mobile regressions"
          git push origin HEAD:fix/project-owner-regression-pass
