name: Project Owner Regression Pass

on:
  push:
    branches:
      - fix/project-owner-regression-pass

permissions:
  contents: write

jobs:
  regression-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-owner-regression-pass
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply regression patch
        run: python3 scripts/project_owner_regression_patch.py
      - name: Align legacy finalize assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/finalize_workflow.test.ts')
          s = p.read_text()
          old = "/Thumbnail generation failed/"
          new = "/สร้างภาพสรุปไม่สำเร็จ/"
          if old not in s:
              raise SystemExit('legacy thumbnail assertion not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify complete application
        run: npm run verify
      - name: Commit validated regression pass
        run: |
          git config user.name "dmfc-regression-bot"
          git config user.email "auto589643@gmail.com"
          git add backend/api/_lib/supabase.mjs src/services/finalizeWorkflow.ts src/App.tsx src/legacy65925.css package.json tests/auth_legacy_compat.test.ts tests/finalize_workflow.test.ts tests/responsive_contract.test.ts supabase/migrations/20260811100000_allow_optimized_examination_finalize.sql REGRESSION_CONTRACT.md
          git commit -m "Harden linked auth finalize and mobile regressions"
          git push origin HEAD:fix/project-owner-regression-pass
