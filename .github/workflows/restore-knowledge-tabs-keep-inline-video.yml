name: Restore knowledge and video tabs

on:
  push:
    branches:
      - fix/restore-tabs-keep-inline-video

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-tabs-keep-inline-video
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded source update
        run: python .github/scripts/restore_knowledge_tabs_keep_inline_video.py

      - name: Install dependencies
        run: npm ci

      - name: Verify lint build tests security and preflight
        run: npm run verify

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit verified source update
        run: |
          rm -f .github/scripts/restore_knowledge_tabs_keep_inline_video.py .github/workflows/restore-knowledge-tabs-keep-inline-video.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "dmfc-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "[dmfc-ready] Restore knowledge and video tabs with inline playback"
          git push origin HEAD:fix/restore-tabs-keep-inline-video
