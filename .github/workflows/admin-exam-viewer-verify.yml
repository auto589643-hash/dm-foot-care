name: Verify admin examination viewer
on:
  push:
    branches: [feat/admin-examination-viewer]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply viewer patch
        run: node scripts/apply-admin-exam-viewer.mjs
      - name: Verify application
        run: npm run verify
      - name: Static viewer assertions
        run: |
          grep -q "HistoricalPhotoViewer" src/App.tsx
          grep -q "detail-photo-button" src/App.tsx
          grep -q "แตะรูปเพื่อขยาย" src/App.tsx
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/legacy65925.css
          git diff --cached --quiet || git commit -m "Enable admin examination image viewer"
          git push
