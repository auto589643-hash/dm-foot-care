name: Verify admin private image fallback
on:
  push:
    branches: [fix/admin-private-exam-images]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply secure image fallback
        run: |
          node scripts/apply-admin-private-image-fallback.mjs
          node - <<'NODE'
          const fs = require('fs')
          const path = 'src/App.tsx'
          let text = fs.readFileSync(path, 'utf8')
          const effect = "\n  useEffect(() => { setResolvedPhotos({ ...(exam.thumbnails ?? {}) }); setSelectedPhoto(null); setPhotoError(''); setLoadingPhoto(null) }, [exam.id, exam.thumbnails])\n"
          if (!text.includes(effect)) throw new Error('viewer reset effect not found')
          text = text.replace(effect, '\n')
          fs.writeFileSync(path, text)
          NODE
      - name: Verify application
        run: npm run verify
      - name: Verify security surface
        run: |
          grep -q "requireAdminUser" backend/api/v1/admin/examination-image.mjs
          grep -q "downloadThumbnail" backend/api/v1/admin/examination-image.mjs
          grep -q "getExaminationImage" src/services/contracts.ts
          grep -q "loadPhoto" src/App.tsx
          grep -q "adminExaminationImage" api/'[...route].mjs'
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/api/_lib/drive.mjs backend/api/v1/admin/examination-image.mjs api/'[...route].mjs' src/services/contracts.ts src/services/httpAdapters.ts src/App.tsx src/legacy65925.css
          git diff --cached --quiet || git commit -m "Add secure admin examination image fallback"
          git push
