name: Apply UX lint fixes

on:
  push:
    branches:
      - feat/ux-speed-optimistic
    paths:
      - .github/workflows/fix-ux-lint.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ux-speed-optimistic
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply lint-safe UX patch
        run: node scripts/fix-ux-lint.mjs
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Make optimistic loading flow lint-safe"
          git push origin HEAD:feat/ux-speed-optimistic
