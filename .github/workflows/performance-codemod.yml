name: Performance Codemod

permissions:
  contents: write

on:
  push:
    branches:
      - agent/performance-api-roundtrips
    paths:
      - .github/workflows/performance-codemod.yml

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply codemod
        run: node scripts/performance-codemod.mjs
      - name: Verify patched application
        run: npm run verify
      - name: Commit clean performance changes
        run: |
          rm scripts/performance-codemod.mjs
          rm .github/workflows/performance-codemod.yml
          rm .github/workflows/performance-verify.yml
          git config user.name "dmfc-performance-bot"
          git config user.email "auto589643@gmail.com"
          git add -A
          git commit -m "Lazy-load patient data for faster navigation"
          git push origin HEAD:agent/performance-api-roundtrips
