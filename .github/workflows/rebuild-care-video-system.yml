name: Rebuild care video system

on:
  push:
    branches:
      - feat/rebuild-care-video-system

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/rebuild-care-video-system
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Repair guarded script markers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_care_video_system_rebuild.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace("'function AdminHome('", "'function DoctorHome('")
          source = source.replace(
              "  return <AdminHome dashboard={dashboard} onOpenUsers={() => setPage('users')} />",
              "  return <DoctorHome onNavigate={setPage} users={userRecords} diseaseRecords={diseaseRecords} adminService={adminService} dashboard={dashboard} />"
          )
          source = source.replace(
              'test += "\\nassert.match(types, /export interface CareVideo/)\\nassert.match(types, /\'videos\'/)\\nassert.match(types, /\'admin-videos\'/)\\nassert.doesNotMatch(types, /KnowledgeArticle[\\\\s\\\\S]*youtubeUrl\\\\?: string/)\\n',
              'test += "\\nassert.match(types, /export interface CareVideo/)\\nassert.match(types, /\'videos\'/)\\nassert.match(types, /\'admin-videos\'/)\\nconst knowledgeArticleBlock = types.match(/export interface KnowledgeArticle \\\\{[\\\\s\\\\S]*?\\\\n\\\\}/)?.[0] ?? \'\'\\nassert.doesNotMatch(knowledgeArticleBlock, /youtubeUrl/)\\n'
          )
          insertion = "replace_once('src/App.tsx', \"  const featuredArticle = articles.find((article) => !article.youtubeUrl) ?? articles[0]\", \"  const featuredArticle = articles[0]\")\n\n"
          marker = "# PatientPages signature and page route\n"
          if insertion not in source:
              source = source.replace(marker, insertion + marker)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Apply guarded source update
        run: python .github/scripts/apply_care_video_system_rebuild.py

      - name: Align feature regression contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/feature_update_contract.test.ts')
          source = path.read_text(encoding='utf-8')
          source = source.replace("const publicKnowledge = read('backend/api/v1/knowledge.mjs')\n", "const publicKnowledge = read('backend/api/v1/knowledge.mjs')\nconst adminVideos = read('backend/api/v1/admin/care-videos.mjs')\nconst publicVideos = read('backend/api/v1/care-videos.mjs')\n")
          legacy_lines = [
              "assert.match(app, /มีวิดีโอ/)\n",
              "assert.match(app, /knowledge-mode-tabs/)\n",
              "assert.match(adminKnowledge, /normalizeYoutubeUrl/)\n",
              "assert.match(adminKnowledge, /youtubeUrl/)\n",
              "assert.match(publicKnowledge, /youtubeUrl/)\n",
              "assert.match(css, /\\.inline-video-section/)\n",
              "assert.match(css, /\\.knowledge-mode-tabs/)\n",
          ]
          for line in legacy_lines:
              source = source.replace(line, '')
          marker = "assert.match(main, /accessibility-overrides\\.css/)\n"
          extra = "assert.doesNotMatch(adminKnowledge, /youtubeUrl/)\nassert.doesNotMatch(publicKnowledge, /youtubeUrl/)\nassert.match(adminVideos, /normalizeYoutubeUrl/)\nassert.match(adminVideos, /dmfc-knowledge-media/)\nassert.match(publicVideos, /care_videos/)\n"
          if extra not in source:
              source = source.replace(marker, extra + marker)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify lint build tests security and preflight
        run: npm run verify

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit verified source update
        run: |
          rm -f .github/scripts/apply_care_video_system_rebuild.py .github/workflows/rebuild-care-video-system.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "dmfc-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "[dmfc-ready] Rebuild dedicated care video system"
          git push origin HEAD:feat/rebuild-care-video-system
