name: Thumbnail Dependency Regression

on:
  push:
    branches:
      - fix/project-owner-regression-pass

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-owner-regression-pass
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply thumbnail dependency patch
        run: python3 scripts/thumbnail_dependency_patch.py
      - name: Verify complete application
        run: npm run verify
      - name: Commit validated changes
        run: |
          git config user.name "dmfc-regression-bot"
          git config user.email "auto589643@gmail.com"
          git add src/App.tsx backend/api/v1/examinations/[id]/thumbnails.mjs src/legacy65925.css package.json tests/thumbnail_dependency_contract.test.ts supabase/migrations/20260811102500_attach_precreated_thumbnail_on_image_insert.sql REGRESSION_CONTRACT.md
          git commit -m "Enforce thumbnail dependency and postconditions"
          git push origin HEAD:fix/project-owner-regression-pass
